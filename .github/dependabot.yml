version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "daily"
          time: "09:00"
          timezone: "Asia/Tokyo"
      cooldown:
          default-days: 3
      open-pull-requests-limit: 5

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "daily"
          time: "09:00"
          timezone: "Asia/Tokyo"
      cooldown:
          default-days: 3
      open-pull-requests-limit: 5
